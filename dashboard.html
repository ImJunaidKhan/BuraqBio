<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="assets/favicon.webp">
    <title>Dashboard | BuraqBio</title>
    <meta name="description" content="Manage your BuraqBio profile and links">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css" type="text/css">
</head>

<body>

    <!-- Topbar -->
    <header class="dashboard-topbar">
        <div class="container topbar-row">
            <a href="index.html" class="topbar-logo">
                <img src="assets/favicon.webp" alt="BuraqBio logo">
                <span class="wordmark">Buraq<span class="bio">Bio</span></span>
            </a>

            <div class="topbar-actions">
                <input type="text" class="url-input" id="chipUrl" value="buraqbio.link/..." readonly>
                <button type="button" class="btn btn-sm btn-outline" id="btnCopyLink">Copy Link</button>
                <a href="#" target="_blank" class="btn btn-sm btn-outline" id="btnViewProfile">View Page</a>
                <button type="button" class="btn btn-sm btn-outline" id="btnLogout">Log out</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container page-content">
        <div class="page-head">
            <h1>Dashboard</h1>
            <p>Manage your links and update your bio.</p>
        </div>

        <!-- Profile Section -->
        <section class="card">
            <div class="card-head">
                <h2>Your Profile</h2>
                <span class="hint">How your page looks to visitors</span>
            </div>

            <form id="profileForm">
                <div class="profile-grid">
                    <div class="avatar-box">
                        <div class="avatar-preview" id="avatarPreview">BB</div>
                        <p class="note">Initials or photo preview</p>
                    </div>

                    <div class="profile-fields">
                        <div class="field">
                            <label for="displayName">Display Name</label>
                            <input class="input" id="displayName" type="text" placeholder="e.g. Sweet Crumb Bakery">
                        </div>

                        <div class="field">
                            <label for="profileBio">Bio</label>
                            <textarea class="input" id="profileBio" rows="2" placeholder="e.g. Custom cakes in Karachi. Order online!"></textarea>
                        </div>

                        <div class="field">
                            <label for="photoUrl">Photo URL (Optional)</label>
                            <input class="input" id="photoUrl" type="url" placeholder="https://example.com/photo.jpg">
                        </div>

                        <button class="btn btn-primary" type="submit" id="btnSaveProfile">Save Profile</button>
                    </div>
                </div>
            </form>
        </section>

        <!-- Links Section -->
        <section class="card">
            <div class="card-head">
                <h2>Your Links</h2>
            </div>

            <!-- Add / Edit Link Form -->
            <form class="add-form" id="addLinkForm">
                <input type="hidden" id="editLinkId" value="">
                <div class="field">
                    <label for="linkTitle">Link Title</label>
                    <input class="input" id="linkTitle" type="text" placeholder="e.g. Order via WhatsApp" required>
                </div>
                <div class="field">
                    <label for="linkUrl">URL</label>
                    <input class="input" id="linkUrl" type="url" placeholder="https://wa.me/923001234567" required>
                </div>
                <div class="form-btn-wrap">
                    <button class="btn btn-primary" type="submit" id="btnAddLink">Add Link</button>
                    <button class="btn btn-outline hidden" type="button" id="btnCancelEdit">Cancel</button>
                </div>
            </form>

            <!-- Empty state -->
            <div class="empty-note" id="emptyNote" style="display: none;">
                <p>No links yet. Add your first link above!</p>
            </div>

            <!-- Links Container -->
            <div class="link-list" id="linkList"></div>
        </section>
    </main>

    <script type="module" src="firebase-init.js"></script>
    <script type="module" src="dashboard.js"></script>
</body>

</html>
