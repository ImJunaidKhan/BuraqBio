<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="assets/favicon.webp">
    <title>Dashboard | BuraqBio</title>
    <meta name="description" content="Manage your BuraqBio profile and links">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css" type="text/css">
</head>

<body>

    <header class="dashboard-topbar">
        <div class="container topbar-row">
            <a href="index.html" class="topbar-logo">
                <img src="assets/favicon.webp" alt="BuraqBio logo">
                <span class="wordmark">Buraq<span class="bio">Bio</span></span>
            </a>

            <div class="topbar-actions">
                <input type="text" class="url-input" id="profilePageUrl" value="buraqbio.link/..." readonly>
                <a href="p.html" target="_blank" class="btn btn-sm btn-outline" id="btnViewProfile">View Page</a>
                <button type="button" class="btn btn-sm btn-outline" id="btnLogout">Log out</button>
            </div>
        </div>
    </header>

    <main class="container page-content">
        <div class="page-head">
            <h1>Dashboard</h1>
            <p>Manage your links and update your bio.</p>
        </div>

        <section class="card">
            <div class="card-head">
                <h2>Your Profile</h2>
            </div>

            <form id="profileForm">
                <div class="profile-grid">
                    <div class="avatar-box">
                        <div class="profile-img" id="profileImg">BB</div>
                        <p class="note">Photo Preview</p>
                    </div>

                    <div class="profile-fields">
                        <div class="field">
                            <label for="displayName">Display Name</label>
                            <input class="input" id="displayName" type="text" placeholder="Sweet Crumb Bakery" required>
                        </div>

                        <div class="field">
                            <label for="profileBio">Bio</label>
                            <textarea class="input" id="profileBio" rows="2"
                                placeholder="Custom cakes in Karachi. Order online!" required></textarea>
                        </div>

                        <div class="field">
                            <label for="photoUrl">Photo URL</label>
                            <input class="input" id="photoUrl" type="url" placeholder="https://example.com/photo.jpg">
                        </div>

                        <button class="btn btn-primary" type="submit">Save Changes</button>
                    </div>
                </div>
            </form>
        </section>

        <section class="card">
            <div class="card-head">
                <h2>Your Links</h2>
            </div>

            <form class="add-form" id="addLinkForm">
                <input type="hidden" id="editLinkId" value="">
                <div class="field">
                    <label for="linkTitle">Link Title</label>
                    <input class="input" id="linkTitle" type="text" placeholder="Order via WhatsApp" required>
                </div>
                <div class="field">
                    <label for="linkUrl">URL</label>
                    <input class="input" id="linkUrl" type="url" placeholder="https://wa.me/923123456789" required>
                </div>
                <div class="form-btn-wrap">
                    <button class="btn btn-primary" type="submit" id="btnAddLink">Add Link</button>
                    <button class="btn btn-outline hidden" type="button" id="btnCancelEdit">Cancel</button>
                </div>
            </form>

            <!-- Empty State -->
            <div class="empty-note hidden" id="emptyNote">
                <p>No links yet. Add your first link above!</p>
            </div>

            <!-- Links Container -->
            <div class="link-list" id="linkList"></div>
        </section>
    </main>

    <script type="module" src="firebase-init.js"></script>
    <script type="module" src="dashboard.js"></script>
</body>

</html>
